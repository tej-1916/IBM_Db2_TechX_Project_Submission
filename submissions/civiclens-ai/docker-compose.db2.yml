# Local IBM Db2 Community Edition for CivicLens AI development.
# Usage (from submissions/civiclens-ai/, with DB2_PASSWORD set in .env):
#   docker compose -f docker-compose.db2.yml up -d
#   docker logs -f civiclens-db2     # wait for "(*) Setup has completed."
services:
  db2:
    image: icr.io/db2_community/db2:latest
    container_name: civiclens-db2
    privileged: true
    ports:
      - "50000:50000"
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${DB2_PASSWORD:?Set DB2_PASSWORD in .env}
      DBNAME: CIVICDB
      BLU: "false"
      ENABLE_ORACLE_COMPATIBILITY: "false"
      SAMPLEDB: "false"
      PERSISTENT_HOME: "false"
    volumes:
      - civiclens_db2_data:/database
volumes:
  civiclens_db2_data:
